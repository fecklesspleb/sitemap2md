name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Offline tests (no network needed; the live test is skipped unless LIVE=1)
        run: python -m unittest -v

      - name: CLI smoke test on a local sitemap file
        run: |
          python sitemap2md.py --version
          python sitemap2md.py tests/fixtures/sitemap.txt --dry-run
